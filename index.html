<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Coin Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#000;--s1:#0b0d10;--s2:#14181d;--ln:#1e242b;--tx:#eef1f4;--mu:#7d8793;--ac:#34d399;--up:#34d399;--dn:#f87171;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
#hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;max-width:480px;margin:auto;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#hd b{font-size:17px}.sp{flex:1}
.ib{position:relative;width:34px;height:34px;border-radius:10px;border:0;background:var(--s2);color:var(--tx);font-size:17px;cursor:pointer}
#app{max-width:480px;margin:auto;padding:4px 12px 14px}
h2{font-size:11px;font-weight:600;color:var(--mu);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.hero{background:linear-gradient(135deg,#0f2a22,#0b0d10 70%);border-color:#14392d}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.mu{color:var(--mu);font-size:12.5px}.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.row:first-child,h2+.row,.dwrap+.row{border-top:0}
.g{flex:1;min-width:0}.g b{display:block;font-weight:600}.g .mu{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r{text-align:right}.r b{display:block;font-weight:600}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#000;flex:none}
.stats{display:flex;gap:20px;margin-top:10px}.stats b{display:block;font-size:13px}
.chips{display:flex;gap:6px;margin-top:10px}
.chip{padding:5px 11px;border-radius:99px;background:var(--s2);color:var(--mu);border:0;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);color:#000;font-weight:600}
.chart{height:96px;margin-top:10px}.chart svg{width:100%;height:100%}
.dwrap{position:relative;width:168px;height:168px;margin:2px auto 8px}.donut{width:100%;height:100%}
.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}.dc b{font-size:22px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
input,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font:inherit;margin-bottom:8px}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
.btn{padding:10px 14px;border-radius:12px;border:0;background:var(--ac);color:#000;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}.btn.del{background:#2a1215;color:var(--dn)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:0;color:var(--mu);font:inherit;font-size:12.5px;padding:7px 2px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--ac);color:#000;font-weight:600}
.dh{color:var(--mu);font-size:12px;padding:10px 0 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.grid2 .card{margin:0}
.st{width:9px;height:9px;border-radius:50%;background:#444;flex:none}.st.ok{background:var(--up)}.st.er{background:var(--dn)}
.pip{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--dn)}
.pip2{width:8px;height:8px;border-radius:50%;background:var(--dn)}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:rgba(11,13,16,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln);border-bottom:0;border-radius:18px 18px 0 0;padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:6}
#nav button{flex:1;background:0;border:0;color:var(--mu);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
#nav button.on{color:var(--ac)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#fabw{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:flex-end;padding:0 14px;pointer-events:none;z-index:6}
#fab{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:0;background:var(--ac);color:#000;font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(52,211,153,.35);cursor:pointer}
#sheet{position:fixed;inset:0;z-index:20}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.sh{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;max-height:86vh;overflow:auto;background:var(--s1);border:1px solid var(--ln);border-radius:18px 18px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom))}
.sh h3{font-size:16px;margin-bottom:8px}.grab{width:36px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 10px}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--ln);padding:9px 14px;border-radius:12px;font-size:13px;max-width:90vw;z-index:30}
.gate{min-height:80vh;display:grid;place-items:center;padding:12px}.gate .card{width:100%;max-width:400px;padding:18px}
.gate h1{font-size:20px;margin-bottom:6px}
</style>
</head>
<body>
<header id="hd" hidden></header>
<div id="app"></div>
<div id="fabw"></div>
<nav id="nav" hidden></nav>
<script>
const APP_VERSION = '1.7.0', MIN_BACKEND = '1.7.0', BUILD = '2026-11-24';
const CHANGES = [
  ['1.7.0', 'UI baru: nav 4 tab, panel bawah, Aset digabung, Transaksi 3 sub-tab, Wallet per kategori, tema hitam; transaksi Solana.'],
  ['1.6.0', 'Tandai spam, tampilan potret, Pembaruan di Pengaturan.'],
  ['1.5.0', 'Nomor versi, cek dan paksa pembaruan.'],
  ['1.4.0', 'Perubahan nilai 24 jam dan 7 hari.'],
  ['1.3.0', 'Swap jadi beli/jual otomatis; transfer internal netral.'],
  ['1.2.0', 'Impor transaksi EVM dan MEXC.'],
];
const $ = s => document.querySelector(s), enc = new TextEncoder(), dec = new TextDecoder();
const H = (t, a, ...k) => {
  const e = document.createElement(t);
  for (const [n, v] of Object.entries(a || {})) {
    if (n === 'class') e.className = v;
    else if (n.startsWith('on')) e[n] = v;
    else if (v !== false && v != null) e.setAttribute(n, v);
  }
  k.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
};
const put = (el, ...k) => el.replaceChildren(...k.flat().filter(x => x != null && x !== false));
const usd = n => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: n > 0 && n < 1 ? 4 : 2 }).format(n || 0);
const idr = n => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n || 0);
const qty = n => new Intl.NumberFormat('en-US', { maximumSignificantDigits: 7 }).format(n || 0);
const pct = n => (n >= 0 ? '+' : '') + (n * 100).toFixed(2) + '%';
const short = a => a ? (a.length > 14 ? a.slice(0, 6) + '…' + a.slice(-4) : a) : '—';
const ago = d => { const m = (Date.now() - new Date(d)) / 6e4; return m < 1 ? 'baru saja' : m < 60 ? Math.round(m) + ' mnt lalu' : m < 1440 ? Math.round(m / 60) + ' jam lalu' : Math.round(m / 1440) + ' hari lalu'; };
const COL = ['#34d399', '#60a5fa', '#fbbf24', '#f472b6', '#22d3ee', '#a78bfa', '#fb923c', '#94a3b8'];
const hue = s => COL[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % COL.length];
const icon = d => { const w = document.createElement('span'); w.innerHTML = '<svg class="i" viewBox="0 0 24 24">' + d + '</svg>'; return w.firstChild; };
const TABS = [
  ['sum', 'Ringkasan', '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],
  ['ast', 'Aset', '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5h4.5a1.5 1.5 0 0 1 0 3H9.5a1.5 1.5 0 0 0 0 3H15"/>'],
  ['trx', 'Transaksi', '<path d="M7 4v16M7 4L3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/>'],
  ['wal', 'Wallet', '<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>'],
];
const TITLES = { sum: 'Ringkasan', ast: 'Aset', trx: 'Transaksi', wal: 'Wallet', set: 'Pengaturan' };
const PAGES = { kon: 'Koneksi & keamanan', upd: 'Pembaruan', spam: 'Spam & disembunyikan', log: 'Log server', ttg: 'Tentang' };
const TY = [['buy', 'Beli'], ['sell', 'Jual'], ['in', 'Masuk'], ['out', 'Keluar'], ['move', 'Pindah internal']], TL = Object.fromEntries(TY);
const S = { tab: 'sum', page: '', sub: { trx: 'hist', wal: 'all' }, cfg: null, d: null, logs: null, ign: null, upd: null, newer: false, q: '', cf: '', tq: '', tf: '', all: false, sp: false, hd: false, range: 30, hid: JSON.parse(localStorage.getItem('hid') || '[]') };

/* ---- kripto: URL + token hanya di perangkat; PIN opsional (PBKDF2 -> AES-GCM) ---- */
const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function dk(pin, salt) {
  const k = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(obj, pin) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await dk(pin, salt), enc.encode(JSON.stringify(obj)));
  return JSON.stringify({ s: b64(salt), i: b64(iv), c: b64(ct) });
}
async function unseal(blob, pin) {
  const o = JSON.parse(blob);
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(o.i) }, await dk(pin, ub(o.s)), ub(o.c))));
}
async function saveCfg(pin) {
  localStorage.removeItem('pf');
  if (pin) { localStorage.setItem('cfg.enc', await seal(S.cfg, pin)); localStorage.removeItem('cfg'); }
  else { localStorage.setItem('cfg', JSON.stringify(S.cfg)); localStorage.removeItem('cfg.enc'); }
}

/* ---- API ---- */
async function api(action, data) {
  const r = await fetch(S.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({}, data, { action, token: S.cfg.token })) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
const toast = m => { const t = H('div', { class: 'toast' }, m); document.body.append(t); setTimeout(() => t.remove(), 2800); };
async function load() {
  try {
    S.d = await api('all');
    if (!localStorage.getItem('cfg.enc')) localStorage.setItem('pf', JSON.stringify(S.d));
    render();
  } catch (e) { toast(e.message === 'unauthorized' ? 'Token ditolak. Periksa di Pengaturan.' : 'Gagal memuat: ' + e.message); }
}
async function run(fn, ok) {
  toast('Memproses…');
  try { await fn(); toast(ok); } catch (e) { toast(e.message); }
  await load();
}

/* ---- panel bawah ---- */
const closeSheet = () => { const e = $('#sheet'); if (e) e.remove(); };
function sheet(title, ...kids) {
  closeSheet();
  document.body.append(H('div', { id: 'sheet' }, H('div', { class: 'bk', onclick: closeSheet }), H('div', { class: 'sh' }, H('div', { class: 'grab' }), H('h3', {}, title), kids)));
}

/* ---- komponen ---- */
const row = (sym, sub, top, bot, cls) => H('div', { class: 'row' },
  H('div', { class: 'av', style: 'background:' + hue(sym) }, (String(sym || '?'))[0].toUpperCase()),
  H('div', { class: 'g' }, H('b', {}, sym || '?'), H('span', { class: 'mu' }, sub)),
  H('div', { class: 'r' }, H('b', { class: cls || '' }, top), H('span', { class: 'mu' }, bot || '')));
const tap = (el, fn) => { el.style.cursor = 'pointer'; el.onclick = fn; return el; };
const load0 = () => H('div', { class: 'card mu' }, 'Memuat data…');
const seg = (opts, cur, fn) => H('div', { class: 'seg' }, opts.map(o => H('button', { class: o[0] === cur ? 'on' : '', onclick: () => fn(o[0]) }, o[1])));
const kv = (a, b) => H('div', { class: 'row' }, H('span', { class: 'mu' }, a), H('b', { style: 'margin-left:auto;text-align:right;word-break:break-all;max-width:70%' }, b));
const go = t => { S.tab = t; S.page = ''; render(); scrollTo(0, 0); };

function chart(pts) {
  if (pts.length < 2) return H('p', { class: 'mu', style: 'margin-top:10px' }, 'Grafik muncul setelah ≥2 hari riwayat.');
  const v = pts.map(x => x.usd), mn = Math.min(...v), mx = Math.max(...v);
  const X = i => (i / (v.length - 1) * 300).toFixed(1), Y = y => (82 - (mx === mn ? .5 : (y - mn) / (mx - mn)) * 74).toFixed(1);
  const d = v.map((y, i) => (i ? 'L' : 'M') + X(i) + ' ' + Y(y)).join('');
  const w = H('div', { class: 'chart' });
  w.innerHTML = '<svg viewBox="0 0 300 90" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".3"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient></defs><path d="' + d + 'L300 90L0 90Z" fill="url(#g)"/><path d="' + d + '" fill="none" stroke="#34d399" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
  return w;
}

function donut(segs, total) {
  const NS = 'http://www.w3.org/2000/svg', C = 2 * Math.PI * 40;
  const el = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const s = el('svg', { viewBox: '0 0 100 100', class: 'donut' });
  let off = 0;
  segs.forEach((g, i) => {
    const len = g.usd / total * C;
    const c = el('circle', { cx: 50, cy: 50, r: 40, fill: 'none', stroke: COL[i % 8], 'stroke-width': 14, 'stroke-dasharray': len + ' ' + (C - len), 'stroke-dashoffset': -off, transform: 'rotate(-90 50 50)' });
    if (g.key !== 'lainnya') { c.style.cursor = 'pointer'; c.addEventListener('click', () => { S.cf = g.key; go('ast'); }); }
    s.append(c); off += len;
  });
  return s;
}

/* ---- 1. ringkasan ---- */
function vSum() {
  const p = S.d && S.d.portfolio; if (!p) return load0();
  const cut = S.range ? Date.now() - S.range * 864e5 : 0, pts = p.history.filter(x => x.date && x.usd > 0 && new Date(x.date) >= cut);
  const tot = p.total_usd || 1, rest = p.by_chain.slice(6).reduce((a, c) => a + c.usd, 0);
  const segs = p.by_chain.slice(0, 6).concat(rest > 0 ? [{ key: 'lainnya', usd: rest }] : []);
  const agg = {};
  p.holdings.filter(h => h.priced).forEach(h => { const t = agg[h.symbol] || (agg[h.symbol] = { s: h.symbol, usd: 0, amt: 0 }); t.usd += h.usd; t.amt += h.amount; });
  const tl = Object.values(agg).sort((a, b) => b.usd - a.usd).slice(0, 5);
  const last = S.d.wallets.reduce((a, w) => Math.max(a, +new Date(w.last_sync || 0)), 0);
  const stat = (l, c) => H('div', {}, H('span', { class: 'mu' }, l), c ? H('b', { class: c.usd >= 0 ? 'up' : 'dn' }, (c.usd >= 0 ? '+' : '') + usd(c.usd) + ' (' + pct(c.pct) + ')') : H('b', { class: 'mu' }, 'menunggu data'));
  return H('div', {},
    H('div', { class: 'card hero' }, H('div', { class: 'mu' }, 'Total portofolio'), H('div', { class: 'big' }, usd(p.total_usd)), H('div', { class: 'mu' }, p.idr_rate ? idr(p.total_idr) : ''),
      H('div', { class: 'stats' }, stat('24 jam', p.change && p.change.d1), stat('7 hari', p.change && p.change.d7)),
      H('div', { class: 'chips' }, [[7, '7H'], [30, '30H'], [90, '90H'], [0, 'Semua']].map(x => H('button', { class: 'chip' + (S.range === x[0] ? ' on' : ''), onclick: () => { S.range = x[0]; render(); } }, x[1]))), chart(pts)),
    H('div', { class: 'card' }, H('h2', {}, 'Alokasi jaringan', H('span', { class: 'mu', style: 'text-transform:none' }, 'ketuk untuk menyaring')),
      H('div', { class: 'dwrap' }, donut(segs, tot), H('div', { class: 'dc' }, H('b', {}, p.by_chain.length), H('span', { class: 'mu' }, 'jaringan'))),
      segs.map((c, i) => { const r = H('div', { class: 'row' }, H('div', { class: 'g' }, H('span', { class: 'dot', style: 'background:' + COL[i % 8] }), c.key.toUpperCase()), H('div', { class: 'r' }, usd(c.usd), H('span', { class: 'mu' }, ' ' + (c.usd / tot * 100).toFixed(1) + '%'))); return c.key === 'lainnya' ? r : tap(r, () => { S.cf = c.key; go('ast'); }); })),
    H('div', { class: 'card' }, H('h2', {}, 'Aset terbesar'), tl.map(t => tap(row(t.s, qty(t.amt), usd(t.usd), (t.usd / tot * 100).toFixed(1) + '%'), () => { S.q = t.s; go('ast'); }))),
    H('div', { class: 'mu', style: 'text-align:center;padding:2px' }, S.d.wallets.length + ' wallet · sinkron ' + (last ? ago(last) : '-') + (p.unpriced ? ' · ' + p.unpriced + ' tanpa harga' : '')));
}

/* ---- 2. aset (digabung per simbol) ---- */
function groups(p) {
  const q = S.q.toLowerCase(), m = {};
  p.holdings.forEach(h => {
    if (S.cf && h.chain !== S.cf) return;
    const key = String(h.symbol).toUpperCase() + (h.priced ? '' : '~'), hid = S.hid.includes(key);
    if (!(hid ? S.hd : (h.priced || (h.spam ? S.sp : S.all)))) return;
    if (q && !(h.symbol + ' ' + h.name + ' ' + h.chain + ' ' + h.wallet).toLowerCase().includes(q)) return;
    const g = m[key] || (m[key] = { key, symbol: h.symbol, name: h.name, usd: 0, amt: 0, items: [], priced: h.priced });
    g.usd += h.usd; g.amt += h.amount; g.items.push(h);
  });
  return Object.values(m).sort((a, b) => b.usd - a.usd);
}
function toggleHide(key) {
  S.hid = S.hid.includes(key) ? S.hid.filter(x => x !== key) : S.hid.concat(key);
  localStorage.setItem('hid', JSON.stringify(S.hid)); closeSheet(); render();
}
function assetSheet(g) {
  sheet(g.symbol + (g.name ? ' · ' + g.name : ''),
    H('p', { class: 'mu', style: 'margin-bottom:6px' }, 'Total ' + qty(g.amt) + (g.priced ? ' · ' + usd(g.usd) : ' · tanpa harga')),
    g.items.map(h => H('div', { class: 'row' },
      H('div', { class: 'g' }, H('b', {}, h.wallet), H('span', { class: 'mu' }, h.chain + (h.contract ? ' · ' + short(h.contract) : ''))),
      H('div', { class: 'r' }, H('b', {}, h.priced ? usd(h.usd) : '–'), H('span', { class: 'mu' }, qty(h.amount))),
      h.contract ? H('button', { class: 'chip', onclick: () => confirm('Tandai ' + h.symbol + ' (' + h.chain + ') sebagai spam?') && (closeSheet(), run(() => api('ignoreAdd', { contract: h.contract, symbol: h.symbol, chain: h.chain }), 'Ditandai spam')) }, 'Spam') : null)),
    H('div', { class: 'btns', style: 'margin-top:12px' },
      H('button', { class: 'btn sec', onclick: () => { closeSheet(); S.tq = g.symbol; S.sub.trx = 'hist'; go('trx'); } }, 'Lihat transaksi'),
      H('button', { class: 'btn sec', onclick: () => toggleHide(g.key) }, S.hid.includes(g.key) ? 'Tampilkan lagi' : 'Sembunyikan')));
}
function vAst() {
  const p = S.d && S.d.portfolio; if (!p) return load0();
  const box = H('div', { class: 'card' }), bar = H('div', { class: 'chips', style: 'flex-wrap:wrap;margin-top:8px' });
  const fill = () => {
    const gs = groups(p);
    put(bar,
      S.cf ? H('button', { class: 'chip on', onclick: () => { S.cf = ''; fill(); } }, S.cf.toUpperCase() + ' ✕') : null,
      H('button', { class: 'chip' + (S.all ? ' on' : ''), onclick: () => { S.all = !S.all; fill(); } }, 'Tanpa harga ' + (p.unpriced || 0)),
      H('button', { class: 'chip' + (S.sp ? ' on' : ''), onclick: () => { S.sp = !S.sp; fill(); } }, 'Spam ' + (p.spam || 0)),
      S.hid.length ? H('button', { class: 'chip' + (S.hd ? ' on' : ''), onclick: () => { S.hd = !S.hd; fill(); } }, 'Disembunyikan ' + S.hid.length) : null);
    put(box, H('h2', {}, 'Aset', H('span', { class: 'mu', style: 'text-transform:none' }, gs.length + ' aset')),
      gs.length ? gs.map(g => {
        const r = tap(row(g.symbol, g.items.length + ' posisi · ' + [...new Set(g.items.map(i => i.chain))].join(', '), g.priced ? usd(g.usd) : '–', qty(g.amt)), () => assetSheet(g));
        if (S.hid.includes(g.key)) r.style.opacity = '.5';
        return r;
      }) : H('p', { class: 'mu' }, 'Tidak ada aset.'));
  };
  fill();
  return H('div', {}, H('div', { class: 'card' }, H('input', { placeholder: 'Cari simbol, nama, jaringan, wallet…', value: S.q, oninput: e => { S.q = e.target.value; fill(); } }), bar), box);
}

/* ---- 3. transaksi ---- */
function txSheet(t) {
  const ty = H('select', {}, TY.map(x => H('option', { value: x[0], selected: x[0] === t.type }, x[1])));
  const pr = H('input', { type: 'number', step: 'any', min: '0', placeholder: 'Harga per koin (USD)', value: t.price || '' });
  sheet(t.symbol + ' · ' + qty(t.qty),
    H('p', { class: 'mu', style: 'margin-bottom:8px' }, new Date(t.date).toLocaleString('id-ID') + ' · ' + (t.wallet || '-') + (t.note ? ' · ' + t.note : '')), ty, pr,
    H('div', { class: 'btns' },
      H('button', { class: 'btn', onclick: () => { closeSheet(); run(() => api('updateTx', { id: t.id, type: ty.value, price: pr.value || 0 }), 'Diperbarui'); } }, 'Simpan'),
      H('button', { class: 'btn del', onclick: () => confirm('Hapus transaksi ini?') && (closeSheet(), run(() => api('deleteTx', { id: t.id }), 'Dihapus')) }, 'Hapus')));
}
function txForm() {
  const f = H('form', { onsubmit: e => { e.preventDefault(); const o = Object.fromEntries(new FormData(e.target)); closeSheet(); run(() => api('addTx', o), 'Transaksi disimpan'); } },
    H('select', { name: 'type' }, TY.map(x => H('option', { value: x[0] }, x[1]))),
    H('input', { name: 'wallet', placeholder: 'Wallet / exchange', list: 'wl' }), H('datalist', { id: 'wl' }, S.d.wallets.map(w => H('option', { value: w.label }))),
    H('input', { name: 'symbol', placeholder: 'Simbol, mis. BTC', required: '' }),
    H('input', { name: 'qty', type: 'number', step: 'any', min: '0', placeholder: 'Jumlah', required: '' }),
    H('input', { name: 'price', type: 'number', step: 'any', min: '0', placeholder: 'Harga per koin (USD)' }),
    H('input', { name: 'fee', type: 'number', step: 'any', min: '0', placeholder: 'Biaya (USD)' }),
    H('input', { name: 'date', type: 'date', value: new Date().toISOString().slice(0, 10) }),
    H('input', { name: 'note', placeholder: 'Catatan' }), H('button', { class: 'btn', style: 'width:100%' }, 'Simpan'));
  sheet('Transaksi baru', f);
}
function txRow(t) {
  const inn = t.type === 'buy' || t.type === 'in', mv = t.type === 'move';
  return tap(row(t.symbol, TL[t.type] + ' · ' + (t.wallet || '-') + (t.source && t.source !== 'manual' ? ' · auto' : ''), (mv ? '↔ ' : inn ? '+' : '-') + qty(t.qty), t.price ? usd(t.price * t.qty) : '', mv ? '' : inn ? 'up' : 'dn'), () => txSheet(t));
}
function vTrx() {
  if (!S.d) return load0();
  const all = S.d.transactions, rev = all.filter(t => (t.type === 'in' || t.type === 'out') && t.source && t.source !== 'manual'), sub = S.sub.trx;
  const head = seg([['hist', 'Riwayat'], ['pnl', 'Posisi & PnL'], ['rev', 'Ditinjau ' + rev.length]], sub, k => { S.sub.trx = k; render(); });
  if (sub === 'pnl') {
    const pn = S.d.pnl, re = pn.reduce((a, x) => a + x.realized, 0), un = pn.reduce((a, x) => a + x.unrealized, 0);
    return H('div', {}, head,
      H('div', { class: 'grid2' }, H('div', { class: 'card' }, H('div', { class: 'mu' }, 'Realized'), H('b', { class: re >= 0 ? 'up' : 'dn', style: 'font-size:18px' }, usd(re))), H('div', { class: 'card' }, H('div', { class: 'mu' }, 'Unrealized'), H('b', { class: un >= 0 ? 'up' : 'dn', style: 'font-size:18px' }, usd(un)))),
      H('div', { class: 'card' }, H('h2', {}, 'Posisi (rata-rata biaya)'), pn.length ? pn.map(x => row(x.symbol, qty(x.qty) + ' @ ' + usd(x.avg_cost), usd(x.value), pct(x.roi) + ' · R ' + usd(x.realized), x.roi >= 0 ? 'up' : 'dn')) : H('p', { class: 'mu' }, 'Catat atau tinjau transaksi beli/jual untuk menghitung PnL.')));
  }
  const list = (sub === 'rev' ? rev : all).filter(t => (!S.tf || t.type === S.tf) && (!S.tq || String(t.symbol).toUpperCase() === S.tq.toUpperCase()));
  const bar = H('div', { class: 'chips', style: 'flex-wrap:wrap;margin:0 0 6px' },
    sub === 'hist' ? [['', 'Semua']].concat(TY).map(x => H('button', { class: 'chip' + (S.tf === x[0] ? ' on' : ''), onclick: () => { S.tf = x[0]; render(); } }, x[1])) : null,
    S.tq ? H('button', { class: 'chip on', onclick: () => { S.tq = ''; render(); } }, S.tq + ' ✕') : null);
  const rows = []; let last = '';
  list.slice(0, 200).forEach(t => {
    const d = new Date(t.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    if (d !== last) { rows.push(H('div', { class: 'dh' }, d)); last = d; }
    rows.push(txRow(t));
  });
  return H('div', {}, head, sub === 'rev' ? H('p', { class: 'mu', style: 'margin-bottom:8px' }, 'Transfer otomatis yang belum diklasifikasi. Ketuk untuk mengubah menjadi Beli/Jual/Internal agar masuk PnL.') : null,
    H('div', { class: 'card' }, bar, rows.length ? rows : H('p', { class: 'mu' }, 'Belum ada transaksi. Impor otomatis berjalan saat sync (EVM, Solana, MEXC).')));
}

/* ---- 4. wallet (per kategori) ---- */
const cat = w => /^(mexc|indodax)$/i.test(w.chain) ? 'ex' : (/^evm$/i.test(w.chain) || /^0x[0-9a-fA-F]{40}$/.test(w.address || '')) ? 'evm' : 'net';
const CATN = { evm: 'EVM', net: 'Jaringan lain', ex: 'Exchange' };
function walSheet(w) {
  sheet(w.label,
    kv('Jaringan', w.chain || 'otomatis'), kv('Alamat', w.address ? short(w.address) : '—'), kv('Sinkron', w.last_sync ? ago(w.last_sync) : 'belum'), kv('Status', String(w.status || '-')),
    H('div', { class: 'btns', style: 'margin-top:12px' },
      w.address ? H('button', { class: 'btn sec', onclick: () => { if (navigator.clipboard) navigator.clipboard.writeText(w.address); toast('Alamat disalin'); } }, 'Salin alamat') : null,
      H('button', { class: 'btn', onclick: () => { closeSheet(); run(() => api('sync', { label: w.label }), 'Sync selesai'); } }, 'Sync'),
      H('button', { class: 'btn del', onclick: () => confirm('Hapus ' + w.label + '?') && (closeSheet(), run(() => api('removeWallet', { label: w.label }), 'Dihapus')) }, 'Hapus')));
}
function walForm(k) {
  const label = H('input', { placeholder: 'Label, mis. Metamask main' }), addr = H('input', { placeholder: 'Alamat wallet', autocomplete: 'off', hidden: k === 'ex' ? '' : null });
  const opts = k === 'evm' ? [['evm', 'Semua jaringan EVM (otomatis)'], ['ronin', 'Ronin'], ['kaia', 'Kaia'], ['wemix', 'Wemix'], ['imx', 'Immutable']]
    : k === 'net' ? [['', 'Otomatis dari alamat'], ['sol', 'Solana'], ['sui', 'Sui'], ['aptos', 'Aptos'], ['ton', 'TON'], ['btc', 'Bitcoin']] : [['mexc', 'MEXC'], ['indodax', 'Indodax']];
  const ch = H('select', {}, opts.map(x => H('option', { value: x[0] }, x[1])));
  sheet('Tambah ' + CATN[k], label, ch, addr, k === 'ex' ? H('p', { class: 'mu', style: 'margin-bottom:8px' }, 'API key read-only disimpan di Script Properties, bukan di sini.') : null,
    H('button', { class: 'btn', style: 'width:100%', onclick: () => {
      const o = { label: label.value.trim(), chain: ch.value, address: addr.value.trim() };
      if (!o.label) return toast('Label wajib diisi');
      closeSheet(); run(async () => { const r = await api('addWallet', o); toast(r.status); }, 'Wallet ditambahkan');
    } }, 'Tambah & scan'));
}
function walAdd() {
  sheet('Tambah wallet', H('p', { class: 'mu', style: 'margin-bottom:6px' }, 'Pilih jenis. Token terdeteksi otomatis setelah ditambahkan.'),
    [['evm', 'EVM', 'Metamask, OKX, Ronin, dll (alamat 0x…)'], ['net', 'Jaringan lain', 'Solana, Sui, Aptos, TON, Bitcoin'], ['ex', 'Exchange', 'MEXC, Indodax']]
      .map(x => tap(H('div', { class: 'row' }, H('div', { class: 'g' }, H('b', {}, x[1]), H('span', { class: 'mu' }, x[2])), H('span', { class: 'mu' }, '›')), () => walForm(x[0]))));
}
function vWal() {
  if (!S.d) return load0();
  const val = {}; S.d.portfolio.by_wallet.forEach(x => { val[x.key] = x.usd; });
  const ws = S.d.wallets, cnt = k => ws.filter(w => cat(w) === k).length, cur = S.sub.wal;
  const mk = w => {
    const st = String(w.status || '');
    return tap(H('div', { class: 'row' }, H('span', { class: 'st ' + (st.startsWith('OK') ? 'ok' : st.startsWith('ERROR') ? 'er' : '') }),
      H('div', { class: 'g' }, H('b', {}, w.label), H('span', { class: 'mu' }, cat(w) === 'ex' ? w.chain : short(w.address) + (w.chain ? ' · ' + w.chain : ''))),
      H('div', { class: 'r' }, H('b', {}, usd(val[w.label] || 0))), H('span', { class: 'mu' }, '›')), () => walSheet(w));
  };
  const gs = ['evm', 'net', 'ex'].filter(k => cur === 'all' || cur === k).map(k => {
    const l = ws.filter(w => cat(w) === k);
    return l.length ? H('div', { class: 'card' }, H('h2', {}, CATN[k] + ' · ' + l.length, H('span', { class: 'mu', style: 'text-transform:none' }, usd(l.reduce((a, w) => a + (val[w.label] || 0), 0)))), l.map(mk)) : null;
  });
  return H('div', {}, seg([['all', 'Semua'], ['evm', 'EVM ' + cnt('evm')], ['net', 'Jaringan ' + cnt('net')], ['ex', 'Exchange ' + cnt('ex')]], cur, k => { S.sub.wal = k; render(); }),
    gs, ws.length ? null : H('div', { class: 'card mu' }, 'Belum ada wallet. Ketuk + untuk menambah.'));
}

/* ---- 5. pengaturan (berjenjang) ---- */
const vcmp = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 4; i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; };
async function checkUpdate(silent) {
  try {
    const t = await (await fetch('index.html?_=' + Date.now(), { cache: 'no-store' })).text();
    const m = t.match(/APP_VERSION\s*=\s*'([^']+)'/);
    if (!m) throw new Error('versi tidak terbaca');
    S.upd = { remote: m[1], at: Date.now() };
    S.newer = vcmp(m[1], APP_VERSION) > 0;
    if (silent) { if (S.newer) toast('Versi baru v' + m[1] + ' (Pengaturan → Pembaruan)'); }
    else toast(S.newer ? 'Ada versi baru v' + m[1] : 'Sudah versi terbaru');
  } catch (e) { if (!silent) toast('Gagal cek: ' + e.message); }
  if (S.cfg) render();
}
async function applyUpdate() {
  toast('Memperbarui…');
  try {
    if ('serviceWorker' in navigator) await Promise.all((await navigator.serviceWorker.getRegistrations()).map(r => r.unregister()));
    if (window.caches) await Promise.all((await caches.keys()).map(k => caches.delete(k)));
  } catch (e) { /* lanjut muat ulang */ }
  setTimeout(() => location.replace(location.pathname + '?u=' + Date.now()), 600);
}
const loadIgn = async () => { try { S.ign = await api('ignoreList'); render(); } catch (e) { toast(e.message); } };
const loadLogs = async () => { try { S.logs = await api('logs'); render(); } catch (e) { toast(e.message); } };
function openPage(p) { S.page = p; if (p === 'log' && !S.logs) loadLogs(); if (p === 'spam' && !S.ign) loadIgn(); render(); scrollTo(0, 0); }

function pUpd() {
  const bv = S.d && S.d.version, rem = S.upd && S.upd.remote, bOld = !bv || vcmp(bv, MIN_BACKEND) < 0;
  return H('div', { class: 'card' },
    H('p', { class: 'mu' }, 'Coin Tracker v' + APP_VERSION + ' · build ' + BUILD),
    H('p', { class: 'mu' }, 'Server: ' + (bv ? 'v' + bv : 'lama / tidak diketahui') + (rem ? ' · terbaru v' + rem : '')),
    bOld ? H('p', { class: 'dn', style: 'font-size:13px;margin-top:6px' }, 'Backend perlu diperbarui: tempel Code.gs terbaru, jalankan setup(), lalu Deploy → Manage deployments → Edit → New version.') : null,
    H('div', { class: 'btns', style: 'margin-top:10px' },
      H('button', { class: 'btn sec', onclick: () => checkUpdate(false) }, 'Periksa pembaruan'),
      H('button', { class: 'btn' + (S.newer ? '' : ' sec'), onclick: applyUpdate }, S.newer ? 'Perbarui ke v' + rem : 'Paksa muat ulang')),
    H('details', { style: 'margin-top:10px' }, H('summary', { class: 'mu' }, 'Riwayat versi'), CHANGES.map(c => H('p', { class: 'mu', style: 'margin-top:6px' }, 'v' + c[0] + ' — ' + c[1]))));
}
function pKon() {
  const locked = !!localStorage.getItem('cfg.enc'), pin = H('input', { type: 'password', placeholder: 'PIN baru (min. 4 karakter)', autocomplete: 'new-password' });
  return H('div', {},
    H('div', { class: 'card' }, H('h2', {}, 'Koneksi'),
      H('p', { class: 'mu', style: 'margin-bottom:10px' }, 'Server: ' + new URL(S.cfg.url).host + ' · tersimpan di perangkat' + (locked ? ' (dienkripsi PIN)' : ' (tanpa PIN)')),
      H('div', { class: 'btns' },
        H('button', { class: 'btn sec', onclick: () => { ['cfg', 'cfg.enc', 'pf'].forEach(k => localStorage.removeItem(k)); S.cfg = null; S.d = null; render(); } }, 'Ganti URL / token'),
        H('button', { class: 'btn del', onclick: () => { if (confirm('Hapus URL, token, dan cache dari perangkat ini?')) { localStorage.clear(); S.cfg = null; S.d = null; render(); } } }, 'Keluar'))),
    H('div', { class: 'card' }, H('h2', {}, 'Kunci PIN'), pin,
      H('div', { class: 'btns' },
        H('button', { class: 'btn', onclick: async () => { if (pin.value.length < 4) return toast('PIN minimal 4 karakter'); await saveCfg(pin.value); toast('PIN aktif'); render(); } }, 'Simpan PIN'),
        locked ? H('button', { class: 'btn sec', onclick: async () => { await saveCfg(''); toast('PIN dihapus'); render(); } }, 'Hapus PIN') : null)));
}
function pSpam() {
  return H('div', {},
    H('div', { class: 'card' }, H('h2', {}, 'Ditandai spam (server)'),
      S.ign ? (S.ign.length ? S.ign.map(x => H('div', { class: 'row' }, H('div', { class: 'g' }, H('b', {}, x.note || 'token'), H('span', { class: 'mu' }, String(x.key))),
        H('button', { class: 'chip', onclick: () => run(async () => { await api('ignoreRemove', { key: x.key }); S.ign = await api('ignoreList'); }, 'Dipulihkan, muncul lagi saat sync') }, 'Pulihkan'))) : H('p', { class: 'mu' }, 'Belum ada token yang ditandai.')) : H('p', { class: 'mu' }, 'Memuat…')),
    H('div', { class: 'card' }, H('h2', {}, 'Disembunyikan (perangkat ini)'),
      S.hid.length ? S.hid.map(k => H('div', { class: 'row' }, H('div', { class: 'g' }, H('b', {}, k.replace('~', '')), H('span', { class: 'mu' }, k.endsWith('~') ? 'tanpa harga' : 'berharga')), H('button', { class: 'chip', onclick: () => toggleHide(k) }, 'Tampilkan'))) : H('p', { class: 'mu' }, 'Tidak ada. Sembunyikan lewat panel aset.')));
}
function pLog() {
  return H('div', { class: 'card' }, H('h2', {}, 'Log server', H('button', { class: 'chip', onclick: loadLogs }, 'Muat ulang')),
    S.logs ? S.logs.map(l => H('div', { class: 'row' }, H('div', { class: 'g' }, H('b', { class: l.level === 'ERROR' ? 'dn' : '' }, l.level), H('span', { class: 'mu', style: 'white-space:normal' }, l.message)))) : H('p', { class: 'mu' }, 'Memuat…'));
}
function pTtg() {
  return H('div', { class: 'card' }, kv('Aplikasi', 'Coin Tracker v' + APP_VERSION), kv('Build', BUILD), kv('Backend', S.d && S.d.version ? 'v' + S.d.version : 'tidak diketahui'),
    kv('Penyimpanan', localStorage.getItem('cfg.enc') ? 'dienkripsi PIN' : 'tanpa PIN'), kv('Server', new URL(S.cfg.url).host));
}
function vSet() {
  if (S.page) return { kon: pKon, upd: pUpd, spam: pSpam, log: pLog, ttg: pTtg }[S.page]();
  const it = (p, t, d, pip) => tap(H('div', { class: 'row' }, H('div', { class: 'g' }, H('b', {}, t), H('span', { class: 'mu' }, d)), pip ? H('i', { class: 'pip2' }) : null, H('span', { class: 'mu' }, '›')), () => openPage(p));
  return H('div', { class: 'card' }, it('kon', 'Koneksi & keamanan', 'URL, token, PIN'), it('upd', 'Pembaruan', 'v' + APP_VERSION + (S.newer ? ' · versi baru tersedia' : ''), S.newer),
    it('spam', 'Spam & disembunyikan', 'Kelola daftar'), it('log', 'Log server', '60 log terakhir'), it('ttg', 'Tentang', 'Versi dan build'));
}

/* ---- kerangka, gerbang, boot ---- */
function quick() {
  sheet('Aksi cepat',
    [['Tambah wallet', walAdd], ['Tambah transaksi', txForm], ['Sync semua', () => { closeSheet(); run(() => api('sync'), 'Sync selesai'); }]]
      .map(x => tap(H('div', { class: 'row' }, H('b', {}, x[0]), H('span', { class: 'mu', style: 'margin-left:auto' }, '›')), x[1])));
}
const fabGo = () => (S.tab === 'trx' ? txForm : S.tab === 'wal' ? walAdd : quick)();

function render() {
  if (!S.cfg) return boot();
  $('#hd').hidden = false; $('#nav').hidden = false;
  const t = S.tab === 'set' && S.page ? PAGES[S.page] : TITLES[S.tab];
  put($('#hd'), S.tab === 'set' ? H('button', { class: 'ib', onclick: () => { if (S.page) S.page = ''; else S.tab = 'sum'; render(); } }, '‹') : null,
    H('b', {}, t), H('span', { class: 'sp' }),
    H('button', { class: 'ib', onclick: () => run(() => api('sync'), 'Sync selesai') }, '↻'),
    H('button', { class: 'ib', onclick: () => go('set') }, '⚙', S.newer ? H('i', { class: 'pip' }) : null));
  put($('#app'), ({ sum: vSum, ast: vAst, trx: vTrx, wal: vWal, set: vSet })[S.tab]());
  put($('#nav'), TABS.map(x => H('button', { class: S.tab === x[0] ? 'on' : '', onclick: () => { S.cf = ''; S.q = ''; S.tq = ''; go(x[0]); } }, icon(x[2]), x[1])));
  put($('#fabw'), S.tab === 'set' ? null : H('button', { id: 'fab', onclick: fabGo }, '+'));
}
function gate(title, sub, form) {
  $('#hd').hidden = true; $('#nav').hidden = true; put($('#fabw'));
  put($('#app'), H('div', { class: 'gate' }, H('div', { class: 'card' }, H('h1', {}, title), H('p', { class: 'mu', style: 'margin-bottom:14px' }, sub), form, H('p', { class: 'mu', style: 'margin-top:14px;font-size:11px' }, 'v' + APP_VERSION))));
}
function setup() {
  gate('Coin Tracker', 'Masukkan URL web app Apps Script dan APP_TOKEN. Keduanya hanya disimpan di perangkat ini, tidak ada di kode.', H('form', { onsubmit: async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(f.url.trim())) return toast('URL harus diakhiri /exec');
    S.cfg = { url: f.url.trim(), token: f.token.trim() };
    try { await api('all'); } catch (err) { S.cfg = null; return toast(err.message); }
    await saveCfg(f.pin && f.pin.length >= 4 ? f.pin : '');
    start();
  } },
    H('input', { name: 'url', placeholder: 'https://script.google.com/macros/s/…/exec', required: '', autocomplete: 'off' }),
    H('input', { name: 'token', type: 'password', placeholder: 'APP_TOKEN', required: '', autocomplete: 'off' }),
    H('input', { name: 'pin', type: 'password', placeholder: 'PIN pengunci (opsional, min. 4)', autocomplete: 'new-password' }),
    H('button', { class: 'btn', style: 'width:100%' }, 'Sambungkan')));
}
function unlock(blob) {
  gate('Buka kunci', 'Masukkan PIN untuk mendekripsi koneksi.', H('form', { onsubmit: async e => {
    e.preventDefault();
    try { S.cfg = await unseal(blob, new FormData(e.target).get('pin')); start(); } catch (err) { toast('PIN salah'); }
  } }, H('input', { name: 'pin', type: 'password', placeholder: 'PIN', required: '', autocomplete: 'current-password' }), H('button', { class: 'btn', style: 'width:100%' }, 'Buka')));
}
function start() {
  const c = localStorage.getItem('pf');
  if (c && !S.d && !localStorage.getItem('cfg.enc')) S.d = JSON.parse(c);
  render(); load();
}
function boot() {
  const p = localStorage.getItem('cfg'), e = localStorage.getItem('cfg.enc');
  if (p) { S.cfg = JSON.parse(p); return start(); }
  if (e) return unlock(e);
  setup();
}
boot();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=' + APP_VERSION);
checkUpdate(true);
document.addEventListener('visibilitychange', () => { if (!document.hidden && (!S.upd || Date.now() - S.upd.at > 9e5)) checkUpdate(true); });
</script>
